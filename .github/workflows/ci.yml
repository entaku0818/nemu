# GitHub Actions では ubuntu 上の軽量チェック（SwiftLint）のみを実行する。
# iOS の build / test はローカルで確認する運用（コマンドは CONTRIBUTING.md 参照）。
# macOSランナー(xcodebuild)のジョブをここに追加しないこと — 過去に2回追加され、
# コスト浪費とシミュレータ環境ドリフトによる赤化を招いている。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v5
      - name: Run SwiftLint
        working-directory: ios/nemu
        run: swiftlint lint --reporter github-actions-logging
