# このワークフローは ubuntu 上の軽量チェック（SwiftLint）のみを実行する。
# iOS の build / test は self-hosted runner 上の ios-ci.yml で実行する。
# GitHub-hosted の macos-* ランナーのジョブは追加しないこと（課金のため禁止）。
# macOS が必要なジョブは self-hosted（ios-ci.yml）のみ可。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v5
      - name: Run SwiftLint
        working-directory: ios/nemu
        run: swiftlint lint --reporter github-actions-logging
